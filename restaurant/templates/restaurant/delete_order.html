<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RestaurantOS - Delete Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&amp;family=Playfair+Display:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "tertiary-fixed": "#ffd9dc",
                "surface-tint": "#e9c349",
                "primary-container": "#d4af37",
                "tertiary-container": "#ff94a1",
                "on-error": "#690005",
                "background": "#111316",
                "primary-fixed-dim": "#e9c349",
                "inverse-primary": "#735c00",
                "outline-variant": "#4d4635",
                "surface": "#111316",
                "on-primary-fixed-variant": "#574500",
                "surface-variant": "#333538",
                "primary-fixed": "#ffe088",
                "inverse-surface": "#e2e2e6",
                "surface-bright": "#37393d",
                "error-container": "#93000a",
                "on-secondary": "#003824",
                "on-primary": "#3c2f00",
                "surface-container-highest": "#333538",
                "on-background": "#e2e2e6",
                "secondary-fixed-dim": "#4edea3",
                "on-primary-container": "#554300",
                "on-tertiary-container": "#8e002f",
                "on-surface-variant": "#d0c5af",
                "on-error-container": "#ffdad6",
                "on-secondary-fixed-variant": "#005236",
                "surface-container": "#1e2023",
                "surface-container-low": "#1a1c1f",
                "surface-container-lowest": "#0c0e11",
                "on-tertiary": "#670020",
                "secondary-container": "#00a572",
                "inverse-on-surface": "#2f3034",
                "on-tertiary-fixed": "#400010",
                "error": "#ffb4ab",
                "on-secondary-container": "#00311f",
                "surface-dim": "#111316",
                "on-surface": "#e2e2e6",
                "outline": "#99907c",
                "tertiary": "#ffbec4",
                "secondary": "#4edea3",
                "surface-container-high": "#282a2d",
                "on-secondary-fixed": "#002113",
                "tertiary-fixed-dim": "#ffb2ba",
                "on-tertiary-fixed-variant": "#910130",
                "secondary-fixed": "#6ffbbe",
                "primary": "#f2ca50",
                "on-primary-fixed": "#241a00"
              },
              "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "0.75rem"
              },
              "spacing": {
                "base": "4px",
                "md": "16px",
                "xl": "40px",
                "xs": "4px",
                "margin": "32px",
                "sm": "8px",
                "lg": "24px",
                "grid-columns": "12",
                "gutter": "16px"
              },
              "fontFamily": {
                "body-sm": ["Outfit"],
                "body-main": ["Outfit"],
                "label-caps": ["Outfit"],
                "data-mono": ["JetBrains Mono"],
                "h1-header": ["Playfair Display"],
                "h2-subhead": ["Playfair Display"],
                "display-hero": ["Playfair Display"]
              },
              "fontSize": {
                "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                "body-main": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                "label-caps": ["11px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                "data-mono": ["13px", { "lineHeight": "1.4", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                "h1-header": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                "h2-subhead": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                "display-hero": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }]
              }
            }
          }
        }
      </script>
</head>
<body class="bg-background text-on-surface font-body-main min-h-screen">
<main class="w-full min-h-screen flex items-center justify-center p-md">
<div class="fixed inset-0 bg-surface/80 backdrop-blur-xl z-0"></div>
<section class="relative z-10 w-full max-w-lg bg-surface-container/70 backdrop-blur-xl border border-outline-variant/30 rounded-xl overflow-hidden shadow-2xl flex flex-col">
<div class="px-lg py-xl flex flex-col items-center justify-center border-b border-outline-variant/30 text-center">
<div class="w-16 h-16 rounded-full bg-error-container/20 flex items-center justify-center mb-md border border-error-container/50 shadow-[0_0_15px_rgba(147,0,10,0.3)]">
<span class="material-symbols-outlined text-error text-[32px]">warning</span>
</div>
<h1 class="font-h2-subhead text-h2-subhead text-on-surface mb-sm">Confirm Deletion</h1>
<p class="font-body-main text-body-main text-on-surface-variant">Are you sure you want to delete this order? This action cannot be undone.</p>
</div>
<div class="p-lg bg-surface-container-low/50">
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Order ID</span>
<span class="font-data-mono text-data-mono text-on-surface font-medium">#ORD-{{ order.id|stringformat:"04d" }}</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Table</span>
<span class="font-body-main text-body-main text-on-surface-variant">Table {{ order.table.number }}</span>
</div>
<div class="flex flex-col gap-xs col-span-2 mt-sm pt-sm border-t border-outline-variant/30">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Items</span>
<span class="font-body-sm text-body-sm text-on-surface">{{ order.items.count }} item(s)</span>
</div>
<div class="flex flex-col gap-xs col-span-2 mt-sm pt-sm border-t border-outline-variant/30">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Current Status</span>
<div class="flex items-center gap-sm mt-xs">
<span class="w-2 h-2 rounded-full {% if order.status == 'Pending' %}bg-primary{% elif order.status == 'served' %}bg-secondary{% else %}bg-error{% endif %}"></span>
<span class="font-body-sm text-body-sm {% if order.status == 'Pending' %}text-primary{% elif order.status == 'served' %}text-secondary{% else %}text-error{% endif %}">{{ order.status|capfirst }}</span>
</div>
</div>
</div>
</div>
<div class="px-lg py-md bg-surface-container flex items-center justify-end gap-md border-t border-outline-variant/30">
<form method="post">
{% csrf_token %}
<div class="flex gap-md">
<a href="{% url 'order_list' %}" class="px-md py-sm rounded-DEFAULT border border-outline-variant text-on-surface hover:bg-surface-bright transition-colors font-body-sm text-body-sm">Cancel</a>
<button class="px-md py-sm rounded-DEFAULT bg-error-container text-on-error-container hover:bg-error hover:text-on-error transition-colors border border-error/50 font-body-sm text-body-sm flex items-center gap-sm" type="submit">
<span class="material-symbols-outlined text-[18px]">delete</span> Confirm Delete
</button>
</div>
</form>
</div>
</section>
</main>
</body></html>
