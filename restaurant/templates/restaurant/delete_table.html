{% extends 'restaurant/base.html' %}

{% block title %}Delete Table{% endblock %}

{% block content %}
<div class="animate-fade-in">
    <div class="flex items-center gap-4 mb-10">
        <a href="{% url 'table_list' %}" class="p-3 rounded-xl bg-white/10 hover:bg-white/20 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <div>
            <h2 class="text-3xl font-bold text-white">Delete Table</h2>
            <p class="text-gray-400">Remove table from restaurant</p>
        </div>
    </div>
</div>

<div class="max-w-lg mx-auto">
    <div class="glass-card rounded-2xl p-8 border-glow text-center">
        <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-red-500/20 flex items-center justify-center">
            <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </div>
        
        <h3 class="text-xl font-bold text-white mb-2">Delete Table #{{ table.number }}?</h3>
        <p class="text-gray-400 mb-8">This action cannot be undone. The table will be permanently removed.</p>
        
        <form method="post" class="flex gap-4">
            {% csrf_token %}
            <button type="submit" class="flex-1 py-4 bg-red-500 rounded-xl font-bold text-white hover:bg-red-600 transition-all duration-300">
                Yes, Delete
            </button>
            <a href="{% url 'table_list' %}" class="flex-1 py-4 rounded-xl font-medium text-gray-400 hover:text-white hover:bg-white/10 transition-all duration-300">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
