<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RestaurantOS - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;family=Playfair+Display:ital,wght@0,400..700;1,400..700&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4d4635; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #99907c; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#f2ca50",
                        "secondary-fixed": "#6ffbbe",
                        "secondary-container": "#00a572",
                        "on-surface": "#e2e2e6",
                        "on-background": "#e2e2e6",
                        "surface-container-high": "#282a2d",
                        "tertiary": "#ffbec4",
                        "on-primary-fixed-variant": "#574500",
                        "background": "#111316",
                        "on-primary": "#3c2f00",
                        "inverse-on-surface": "#2f3034",
                        "surface-container-low": "#1a1c1f",
                        "on-primary-fixed": "#241a00",
                        "on-secondary": "#003824",
                        "surface-bright": "#37393d",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container": "#1e2023",
                        "on-tertiary-container": "#8e002f",
                        "error-container": "#93000a",
                        "on-primary-container": "#554300",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-container": "#d4af37",
                        "tertiary-fixed-dim": "#ffb2ba",
                        "on-secondary-fixed": "#002113",
                        "on-error": "#690005",
                        "tertiary-container": "#ff94a1",
                        "on-tertiary-fixed-variant": "#910130",
                        "surface": "#111316",
                        "inverse-surface": "#e2e2e6",
                        "surface-variant": "#333538",
                        "surface-container-lowest": "#0c0e11",
                        "outline": "#99907c",
                        "surface-dim": "#111316",
                        "on-tertiary": "#670020",
                        "primary-fixed-dim": "#e9c349",
                        "outline-variant": "#4d4635",
                        "inverse-primary": "#735c00",
                        "tertiary-fixed": "#ffd9dc",
                        "on-secondary-container": "#00311f",
                        "primary-fixed": "#ffe088",
                        "on-tertiary-fixed": "#400010",
                        "secondary": "#4edea3",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#333538",
                        "error": "#ffb4ab",
                        "surface-tint": "#e9c349",
                        "on-surface-variant": "#d0c5af"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": { "gutter": "16px", "lg": "24px", "base": "4px", "xl": "40px", "sm": "8px", "md": "16px", "xs": "4px", "margin": "32px", "grid-columns": "12" },
                    "fontFamily": { "label-caps": ["Outfit", "sans-serif"], "body-sm": ["Outfit", "sans-serif"], "h1-header": ["Playfair Display", "serif"], "display-hero": ["Playfair Display", "serif"], "h2-subhead": ["Playfair Display", "serif"], "data-mono": ["JetBrains Mono", "monospace"], "body-main": ["Outfit", "sans-serif"] },
                    "fontSize": { "label-caps": ["11px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }], "h1-header": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }], "display-hero": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }], "h2-subhead": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }], "data-mono": ["13px", { "lineHeight": "1.4", "letterSpacing": "-0.02em", "fontWeight": "500" }], "body-main": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }] }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-main min-h-screen flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 z-0 bg-background">
<div class="absolute inset-0 bg-[#0c0e11]/75 z-10 mix-blend-multiply"></div>
<img alt="High-end restaurant interior" class="w-full h-full object-cover opacity-80 object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAE2U4_DD87aq5sO2iRc_GnwKymruvnm4ONbP8kGjQAWNFa5YvMbqhFhCB7gSm09rDg3JQtONfXN-NJYe1S9oOanNRU5IO8B7NIhihRm3HHEM4TSYKp0umNcwShp5zHMg2_63EGUkR5zbgJjMjw-B0WAp2rMGKCcHPCBhMEQi5sCm3W3JCH_oiSJFEv8IYjpFoVtUY5Mz3uEVExGUxI9YgMucAhnJp-_drSKsR4gQ1tiCmvjGiNJVbzlmj3DFaR7Xrj8opgwpO8Qe8"/>
</div>
<div class="relative z-10 w-full max-w-md px-md">
<div class="bg-surface-container-low/60 backdrop-blur-xl border border-primary-container/50 rounded-xl p-margin shadow-[0_16px_48px_rgba(0,0,0,0.8)]">
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 rounded-full bg-surface-container-high border border-primary-container/60 flex items-center justify-center mb-md shadow-[0_0_20px_rgba(212,175,55,0.2)]">
<span class="material-symbols-outlined text-[32px] text-primary-container" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
</div>
<h1 class="font-h1-header text-h1-header text-primary-container tracking-tight">RestaurantOS</h1>
<p class="font-label-caps text-label-caps text-primary-container/80 mt-sm tracking-[0.2em] uppercase">Secure Access Terminal</p>
</div>
{% if form.errors %}
<div class="mb-lg p-md bg-error-container/20 border border-error/30 rounded-lg">
<p class="font-body-sm text-body-sm text-error flex items-center gap-sm"><span class="material-symbols-outlined text-[18px]">error</span> Invalid username or password. Please try again.</p>
</div>
{% endif %}
<form class="flex flex-col gap-lg" method="post">
{% csrf_token %}
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="username">Operator ID / Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline/80 text-[20px]">person</span>
<input class="w-full bg-surface-container-lowest/70 border border-outline-variant/60 rounded-lg pl-12 pr-md py-3.5 font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder-outline/40 transition-all duration-300" id="username" name="username" placeholder="e.g. chef.smith@os" type="text"/>
</div>
</div>
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Authorization Key</label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline/80 text-[20px]">lock</span>
<input class="w-full bg-surface-container-lowest/70 border border-outline-variant/60 rounded-lg pl-12 pr-12 py-3.5 font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder-outline/40 transition-all duration-300" id="password" name="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-sm mt-xs">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-4 h-4 border border-outline-variant rounded bg-surface-container-lowest/50 checked:bg-gradient-to-br checked:from-primary-container checked:to-primary checked:border-transparent focus:outline-none focus:ring-2 focus:ring-primary-container/30 transition-all cursor-pointer" id="remember" name="remember" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[14px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Maintain secure session</label>
</div>
<button class="mt-sm w-full bg-gradient-to-r from-primary-container to-primary text-on-primary font-body-main font-semibold py-3.5 rounded-lg border border-transparent hover:shadow-[0_0_24px_rgba(212,175,55,0.4)] hover:brightness-110 transition-all duration-300 flex items-center justify-center gap-sm" type="submit">
                    Authenticate
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="flex items-center gap-md my-lg opacity-40">
<div class="h-px flex-1 bg-outline-variant"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">OR</span>
<div class="h-px flex-1 bg-outline-variant"></div>
</div>
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Unregistered terminal?
                    <a class="text-primary-container hover:text-primary font-medium border-b border-primary-container/30 hover:border-primary transition-colors pb-xs" href="{% url 'register' %}">Request system access</a>
</p>
</div>
</div>
<div class="mt-lg flex justify-center items-center gap-sm opacity-80 backdrop-blur-sm py-2 px-4 rounded-full bg-surface-container-lowest/40 w-max mx-auto border border-outline-variant/20">
<div class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(78,222,163,0.8)]"></div>
<span class="font-data-mono text-[11px] text-on-surface-variant uppercase tracking-wider">System Operational - Core V.2.4</span>
</div>
</div>
</body></html>
